name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  source:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source tarball
        run: |
          git archive --format=tar.gz \
            --prefix="kidsh-${{ needs.meta.outputs.version }}/" \
            -o "kidsh-${{ needs.meta.outputs.version }}.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: kidsh-${{ needs.meta.outputs.version }}.tar.gz
          if-no-files-found: error

  archives:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Linux archives
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          for GOARCH in amd64 arm64 riscv64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o kidsh ./src
            stage="$(mktemp -d)"
            cp kidsh README.md LICENSE.txt "$stage/"
            tar -C "$stage" -czf "dist/kidsh-${VERSION}-linux-${GOARCH}.tar.gz" \
              kidsh README.md LICENSE.txt
            rm -rf "$stage" kidsh
          done
      - uses: actions/upload-artifact@v4
        with:
          name: archives-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build macOS binaries
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          for GOARCH in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$GOARCH" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "kidsh-${GOARCH}" ./src
            codesign --force --sign - "kidsh-${GOARCH}" || true
            stage="$(mktemp -d)"
            cp "kidsh-${GOARCH}" "$stage/kidsh"
            cp README.md LICENSE.txt "$stage/"
            tar -C "$stage" -czf "dist/kidsh-${VERSION}-darwin-${GOARCH}.tar.gz" \
              kidsh README.md LICENSE.txt
            rm -rf "$stage"
          done
          lipo -create -output kidsh kidsh-arm64 kidsh-amd64
          codesign --force --sign - kidsh || true
          stage="$(mktemp -d)"
          cp kidsh README.md LICENSE.txt "$stage/"
          tar -C "$stage" -czf "dist/kidsh-${VERSION}-darwin-universal.tar.gz" \
            kidsh README.md LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: archives-darwin
          path: dist/*.tar.gz
          if-no-files-found: error

  debian:
    needs: meta
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debian_arch: [amd64, arm64, riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Debian build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts build-essential ca-certificates
      - name: Set package version
        run: bash packaging/scripts/set-version.sh "${{ needs.meta.outputs.version }}"
      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b -d -a "${{ matrix.debian_arch }}"
          mkdir -p dist
          mv ../*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: debian-${{ matrix.debian_arch }}
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    needs: [meta, source]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            rpm_arch: x86_64
          - goarch: arm64
            rpm_arch: aarch64
          - goarch: riscv64
            rpm_arch: riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: .
      - name: Set package version
        run: bash packaging/scripts/set-version.sh "${{ needs.meta.outputs.version }}"
      - name: Build RPM
        run: |
          docker run --rm \
            -e VERSION="${{ needs.meta.outputs.version }}" \
            -e GOARCH="${{ matrix.goarch }}" \
            -e RPM_ARCH="${{ matrix.rpm_arch }}" \
            -v "$PWD":/src \
            -w /src \
            fedora:latest \
            bash packaging/scripts/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: "*.rpm"
          if-no-files-found: error

  alpine:
    needs: [meta, source]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            carch: x86_64
          - goarch: arm64
            carch: aarch64
          - goarch: riscv64
            carch: riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: .
      - name: Set package version
        run: bash packaging/scripts/set-version.sh "${{ needs.meta.outputs.version }}"
      - name: Load Alpine signing key
        env:
          ALPINE_ABUILD_PRIVKEY: ${{ secrets.ALPINE_ABUILD_PRIVKEY }}
        run: |
          if [ -z "$ALPINE_ABUILD_PRIVKEY" ]; then
            echo "Repository secret ALPINE_ABUILD_PRIVKEY is required to sign Alpine packages." >&2
            echo "Generate a key with packaging/scripts/gen-alpine-key.sh" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$ALPINE_ABUILD_PRIVKEY" | tr -d '\r' > alpine-abuild.rsa
      - name: Build Alpine package
        env:
          ALPINE_ABUILD_KEY_NAME: ${{ vars.ALPINE_ABUILD_KEY_NAME }}
        run: |
          KEY_NAME="${ALPINE_ABUILD_KEY_NAME:-kidsh@wilbur.space.rsa}"
          docker run --rm \
            -e VERSION="${{ needs.meta.outputs.version }}" \
            -e GOARCH="${{ matrix.goarch }}" \
            -e CARCH="${{ matrix.carch }}" \
            -e ALPINE_ABUILD_KEY_NAME="$KEY_NAME" \
            -e ALPINE_ABUILD_PRIVKEY_FILE=/run/secrets/abuild.rsa \
            -v "$PWD":/src \
            -v "$PWD/alpine-abuild.rsa":/run/secrets/abuild.rsa:ro \
            -w /src \
            alpine:latest \
            sh packaging/scripts/build-apk.sh
          rm -f alpine-abuild.rsa
      - uses: actions/upload-artifact@v4
        with:
          name: alpine-${{ matrix.carch }}
          path: "*.apk"
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.carch == 'x86_64'
        with:
          name: alpine-signing-key
          path: "*.rsa.pub"
          if-no-files-found: error

  arch:
    needs: [meta, source]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            carch: x86_64
          - goarch: arm64
            carch: aarch64
          - goarch: riscv64
            carch: riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: .
      - name: Set package version
        run: bash packaging/scripts/set-version.sh "${{ needs.meta.outputs.version }}"
      - name: Build Arch package
        run: |
          docker run --rm \
            -e VERSION="${{ needs.meta.outputs.version }}" \
            -e GOARCH="${{ matrix.goarch }}" \
            -e CARCH="${{ matrix.carch }}" \
            -v "$PWD":/src \
            -w /src \
            archlinux:latest \
            bash packaging/scripts/build-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch-${{ matrix.carch }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  snap:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set package version
        run: bash packaging/scripts/set-version.sh "${{ needs.meta.outputs.version }}"
      - uses: snapcore/action-build@v1
        id: snapcraft
      - uses: actions/upload-artifact@v4
        with:
          name: kidsh-${{ needs.meta.outputs.version }}-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  flatpak:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Set package version
        run: bash packaging/scripts/set-version.sh "${{ needs.meta.outputs.version }}"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: kidsh-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.jonathanwilbur.kidsh.yml
          cache-key: flatpak-builder-${{ github.sha }}-${{ matrix.arch }}
          arch: ${{ matrix.arch }}
          run-tests: true
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: kidsh-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  homebrew:
    needs: [meta, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: .
      - name: Generate Homebrew formula
        run: |
          SHA256="$(sha256sum "kidsh-${{ needs.meta.outputs.version }}.tar.gz" | awk '{print $1}')"
          bash packaging/scripts/write-homebrew-formula.sh \
            "${{ needs.meta.outputs.version }}" \
            "${{ needs.meta.outputs.tag }}" \
            "${SHA256}"
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew
          path: kidsh.rb
          if-no-files-found: error

  publish:
    needs:
      - meta
      - source
      - archives
      - macos
      - debian
      - rpm
      - alpine
      - arch
      - snap
      - flatpak
      - homebrew
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          files: artifacts/*
